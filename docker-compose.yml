services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morningmoney
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Australia/Sydney
      - LOCAL_USER_EMAIL=${LOCAL_USER_EMAIL:-you@email.com}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/morningmoney
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/morningmoney
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - OPECODE_GO_API_KEY=${OPECODE_GO_API_KEY:-}
      - OPECODE_GO_MODEL=${OPECODE_GO_MODEL:-deepseek-v4-flash}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Morning Money <daily@localhost>}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./pdfs:/app/pdfs
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  cron:
    image: alpine:3.21
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        echo '0 10 * * 1-5 curl -sf http://app:3000/api/cron/daily-digest -H "Authorization: Bearer '"$CRON_SECRET"'"' | crontab -
        crond -f -l 2
    environment:
      - TZ=Australia/Sydney
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
