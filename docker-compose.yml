services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morningmoney
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - LOCAL_USER_EMAIL=${LOCAL_USER_EMAIL:-you@email.com}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/morningmoney
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/morningmoney
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:12b}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-Morning Money <daily@localhost>}
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
